<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Atharv Ingle, Computer Engineering Student" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1b1148"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .name { font-size: 62px; font-weight: 700; fill: url(#name); }
    .role { font-size: 26px; fill: #c9d1d9; opacity: 0; animation: cycle 9s infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .tag { font-size: 15px; fill: #8b949e; letter-spacing: 3px; }
    .glyph { font-size: 34px; fill: #58a6ff; opacity: 0.22; animation: float 6s ease-in-out infinite; }
    .g2 { animation-delay: 1.2s; fill: #a371f7; }
    .g3 { animation-delay: 2.4s; fill: #3fb950; }
    .g4 { animation-delay: 3.6s; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    .orb { animation: pulse 5s ease-in-out infinite; }
    @keyframes cycle { 0% {opacity:0; transform: translateY(8px);} 4% {opacity:1; transform: translateY(0);} 30% {opacity:1;} 33% {opacity:0;} 100% {opacity:0;} }
    @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }
    @keyframes blink { 0%,50% {opacity:1;} 50.01%,100% {opacity:0;} }
    @keyframes pulse { 0%,100% {opacity:0.18;} 50% {opacity:0.34;} }
  </style>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>

  <circle class="orb" cx="880" cy="60" r="110" fill="#a371f7"/>
  <circle class="orb" cx="90" cy="250" r="90" fill="#58a6ff" style="animation-delay:2s"/>

  <text class="glyph" x="70" y="70">&lt;/&gt;</text>
  <text class="glyph g2" x="820" y="230">{ }</text>
  <text class="glyph g3" x="905" y="150">C++</text>
  <text class="glyph g4" x="40" y="190">$_</text>

  <text class="tag" x="500" y="68" text-anchor="middle">HELLO WORLD, I AM</text>
  <text class="name" x="500" y="140" text-anchor="middle" filter="url(#glow)">Atharv Ingle</text>

  <g transform="translate(500 195)">
    <text class="role" text-anchor="middle">Computer Engineering Student</text>
    <text class="role r2" text-anchor="middle">C++ | JavaScript | Bash</text>
    <text class="role r3" text-anchor="middle">Open Source Contributor</text>
  </g>

  <rect class="cursor" x="500" y="225" width="14" height="4" rx="2" transform="translate(-7 0)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
